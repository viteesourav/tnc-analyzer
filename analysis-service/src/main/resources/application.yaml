spring:
  application:
    name: analysis-service

  # database connection details..
  datasource:
    url: jdbc:postgresql://localhost:5432/tncdb?options=-c%20TimeZone=UTC
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: update # This tells hiberate to create/update table automatically. [NOT to be used in production / For dev only]
      dialect: org.hibernate.dialect.PostgreSQLDialect # fix: timezone mis-matched issue with postgres -> this makes sure it connects.
    properties:
      hibernate.jdbc.time_zone: UTC

    show-sql: true # This prints sql queries in log.
  
  data:
    redis:
      host: localhost
      port: 6379

# Gemini API Secert Key
gemini:
  api:
    key: ${GEMINI_API_KEY}

server:
  port: 8081